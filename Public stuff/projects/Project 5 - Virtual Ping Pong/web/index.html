<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rogers Cup Ping-Pong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- in-game HUD -->
  <div id="hud" class="hidden">
    <div class="pill" id="streakPill"><span class="label">STREAK</span><span id="streak">0</span><span id="fire"></span></div>
    <div class="pill right" id="recordPill">
      <span class="label">RECORD</span><span id="record">0.0</span>
      <span class="mqtt"><i id="mqttDot"></i><span id="topic"></span></span>
    </div>
  </div>

  <!-- always-on controls (clickable; keys in brackets) -->
  <div id="controls">
    <button id="homeBtn" class="ctl hidden" title="Quit to the opponent select screen">🏠 Home</button>
    <button id="voiceBtn" class="ctl" title="Commentators on/off (M)">🎙 Commentary</button>
    <button id="crowdBtn" class="ctl" title="Crowd noise on/off (C)">👥 Crowd</button>
    <span id="boothBadge" class="ctl badge s-loading" title="AI colour commentator">🤖 Sonia: warming up…</span>
    <span id="wxBadge" class="ctl badge hidden" title="Live weather at Tufts"></span>
  </div>

  <!-- pre-match show: lower-third cards + skip -->
  <div id="show" class="hidden">
    <div class="lower">
      <div id="ltTitle" class="lt"></div>
      <div id="ltWeather" class="lt"></div>
      <div id="ltOpp" class="lt"></div>
      <div id="ltPlayer" class="lt"></div>
    </div>
    <button id="skipBtn" class="skip">Skip ▸ <kbd>Enter</kbd><i id="showBar"></i></button>
  </div>

  <!-- select screen -->
  <div id="select" class="hidden">
    <h1 class="logo">ROGERS <span>CUP</span></h1>
    <p class="sub">Hold an opponent's <b>AprilTag</b> up to the camera</p>
    <div id="cards"></div>
    <button id="startBtn" class="confirm" disabled>Choose your opponent</button>
    <div class="inset"><img id="camInset" alt=""><span>camera</span></div>
  </div>

  <!-- game over -->
  <div id="over" class="over hidden">
    <div class="overCard">
      <h2 id="overTitle"></h2>
      <p id="overScore"></p>
      <p id="overRecord"></p>
      <div class="overBtns">
        <button id="overHome" class="big">🏠 Home <kbd>Enter</kbd></button>
        <button id="overRematch" class="big alt">↻ Rematch <kbd>R</kbd></button>
      </div>
    </div>
  </div>

  <div id="banner" class="banner hidden"></div>
  <div id="caption" class="caption"></div>
  <div id="subBanner" class="subbanner hidden"></div>
  <div id="bubble" class="bubble hidden"></div>
  <div id="hint" class="hint"></div>
  <div id="debug" class="debug hidden"></div>
  <div id="conn" class="conn">Connecting to game&hellip;<small>start <code>pingpong.py</code></small></div>

  <script type="module" src="game.js"></script>
</body>
</html>
